[package]
name = "fp-collect"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
fp-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
dirs = "6"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.34", features = ["bundled-full"] }
quick-xml = "0.37"
# rotated logs are gzipped (`dpkg.log.2.gz`)
flate2 = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
flate2 = "1"

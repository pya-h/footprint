[package]
name = "footprint"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "footprint"
path = "src/main.rs"

[dependencies]
fp-core = { path = "../core" }
fp-store = { path = "../store" }
fp-collect = { path = "../collect" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
libc = "0.2"
tempfile = "3"
serde_json = "1"

[dev-dependencies]
fp-fixtures = { path = "../fixtures" }

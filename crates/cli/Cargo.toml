[package]
name = "footprint"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "footprint"
path = "src/main.rs"

[dependencies]
fp-core = { path = "../core" }
fp-store = { path = "../store" }
fp-correlate = { path = "../correlate" }
fp-render = { path = "../render" }
fp-query = { path = "../query" }
fp-tui = { path = "../tui" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
fp-fixtures = { path = "../fixtures" }
tempfile = "3"
